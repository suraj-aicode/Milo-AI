<style>
        body {
            font-family: 'Geist', sans-serif;
            background: linear-gradient(135deg, #F9FBFD 0%, #F8FCFB 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-surface {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }

        .glass-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(111, 168, 255, 0.15) 0%, rgba(203, 190, 255, 0.1) 100%);
            filter: blur(40px);
            z-index: -1;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.1); }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .input-focus-effect:focus-within {
            border-color: #135eb0;
            box-shadow: 0 0 0 4px rgba(19, 94, 176, 0.1);
        }

        .liquid-gradient-bg {
            background: radial-gradient(circle at 10% 20%, rgba(111, 168, 255, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(203, 190, 255, 0.1) 0%, transparent 40%);
        }

<body class="flex items-center justify-center p-margin-mobile md:p-0 relative overflow-hidden">
<!-- Atmospheric Background Elements -->
<div class="fixed inset-0 liquid-gradient-bg z-[-2]"></div>
<div class="glass-circle w-[400px] h-[400px] -top-20 -left-20" style="animation-delay: 0s;"></div>
<div class="glass-circle w-[600px] h-[600px] -bottom-40 -right-40" style="animation-delay: -5s;"></div>
<div class="glass-circle w-[300px] h-[300px] top-1/2 left-1/3 opacity-40" style="animation-delay: -2s;"></div>
<!-- Main Container -->
<main class="w-full max-w-[480px] z-10">
<!-- Brand Identity (Top-center) -->
<div class="flex flex-col items-center mb-lg space-y-base">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-lg transform transition-transform hover:rotate-6">
<span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Aether AI</h1>
</div>
<!-- Login Card -->
<div class="glass-surface rounded-[24px] p-lg md:p-xl transition-all duration-500 hover:shadow-[0_20px_60px_rgba(15,23,42,0.12)]">
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your workspace.</p>
</div>
<!-- Login Form -->
<form class="space-y-md" onsubmit="event.preventDefault()">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block px-1" for="email">Email Address</label>
<div class="relative flex items-center input-focus-effect transition-all duration-300 border border-outline-variant bg-white/30 rounded-xl px-md h-[56px]">
<span class="material-symbols-outlined text-outline mr-sm">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative flex items-center input-focus-effect transition-all duration-300 border border-outline-variant bg-white/30 rounded-xl px-md h-[56px]">
<span class="material-symbols-outlined text-outline mr-sm">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-outline-variant outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-label-md text-label-md rounded-xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-base" type="submit">
                    Continue
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="mx-md font-label-sm text-label-sm text-outline-variant uppercase tracking-widest">or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center h-[56px] rounded-xl border border-outline-variant bg-white/20 hover:bg-white/40 transition-all active:scale-[0.98] group">
<!-- Google Icon (Simplified) -->

</div>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center h-[56px] rounded-xl border border-outline-variant bg-white/20 hover:bg-white/40 transition-all active:scale-[0.98] group">
<div class="w-5 h-5 mr-sm flex items-center justify-center">
<svg class="w-full h-full fill-on-surface" viewbox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path></svg>
</div>
<span class="font-label-md text-label-md text-on-surface">GitHub</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-lg flex justify-center space-x-lg">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Us</a>
</div>
</main>
<!-- Side Graphic (Desktop only subtle touch) -->
<div class="hidden lg:block fixed right-[-100px] top-1/2 -translate-y-1/2 opacity-20">
<div class="relative w-[600px] h-[600px] border border-primary/20 rounded-full flex items-center justify-center">
<div class="w-[450px] h-[450px] border border-primary/10 rounded-full flex items-center justify-center">
<div class="w-[300px] h-[300px] border border-primary/5 rounded-full"></div>
</div>
</div>

<!-- Script for a subtle interaction: mouse following light -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            document.querySelector('.liquid-gradient-bg').style.background = `
                radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(111, 168, 255, 0.12) 0%, transparent 35%),
                radial-gradient(circle at ${100 - (x * 100)}% ${100 - (y * 100)}%, rgba(203, 190, 255, 0.15) 0%, transparent 35%)
            `;
        });
    </script>
